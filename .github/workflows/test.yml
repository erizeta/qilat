name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Benchmarks compile and pass sanity checks
        working-directory: benchmarks
        run: go test -run . -bench '^$' ./...
