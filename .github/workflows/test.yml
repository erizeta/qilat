name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Benchmarks compile and pass sanity checks
        working-directory: benchmarks
        run: go test -run . -bench '^$' ./...

  h2spec:
    name: HTTP/2 conformance (h2spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - name: Install h2spec
        run: go install github.com/summerwind/h2spec/cmd/h2spec@v1.5.1-0.20220625142712-af83a65f0b62
      - name: Run h2spec
        run: H2SPEC="$(go env GOPATH)/bin/h2spec" go test -run TestH2Spec -v .
