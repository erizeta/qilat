version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - revive
  exclusions:
    rules:
      # Benchmarks and tests intentionally use loopback servers and fixed inputs.
      - path: _test\.go
        linters:
          - gosec
      # Test handlers implement fixed signatures and often ignore one argument.
      - path: _test\.go
        linters:
          - revive
        text: unused-parameter
      # HTTP/2 and HTTP/3 framing, HPACK, and QPACK pack integers into bytes on purpose; values are range-checked first.
      - path: internal/h[23]/
        linters:
          - gosec
        text: G115

formatters:
  enable:
    - gofmt
